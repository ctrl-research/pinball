custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; Threads are off so the build runs on GitHub Pages, which cannot send the
; cross-origin-isolation headers a threaded Godot web export requires.
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
; Injected into the exported page's <head>. Three separate jobs, all of them
; about stopping the *browser* from moving a view the game thinks is fixed:
;
;   1. Pinch-zoom. On a trackpad this is one careless two-finger rest away, and
;      once the visual viewport is zoomed the browser pans it to follow focus
;      every time you press a key -- which reads as the game panning when you
;      hit a flipper. ctrl+wheel is how Chrome does it, the gesture* events are
;      how Safari does it.
;   2. Overscroll and page scroll. Nothing should be scrollable; overscroll
;      -behavior also kills macOS rubber-banding, which is itself a pan.
;   3. Focus. Godot preventDefaults keys that reach the canvas, but only the
;      canvas -- if focus drifts to the document the keys become the browser's
;      again. This puts it back, while leaving real text fields alone so the
;      seed box still works.
;
; Kept to one line because that is what a ConfigFile string is; the reasoning
; lives here rather than in the minified blob.
html/head_include="<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}canvas{display:block;outline:none;touch-action:none}</style><script>(function(){var s=function(e){e.preventDefault()};addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});['gesturestart','gesturechange','gestureend'].forEach(function(n){addEventListener(n,s)});addEventListener('keydown',function(e){var t=e.target,g=t&&t.tagName;if(g==='INPUT'||g==='TEXTAREA')return;var c=document.getElementById('canvas');if(c&&document.activeElement!==c&&(!document.activeElement||document.activeElement===document.body))c.focus()},true)})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.043, 0.039, 0.063, 1)

