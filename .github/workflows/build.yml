name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# GitHub Pages allows one deployment at a time, so overlapping main runs race
# each other and the superseded deployment fails. On main, queue runs so every
# merge still publishes, in order. Superseded PR runs are simply cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.6.3"

jobs:
  build:
    name: Export Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

          # Templates extract into a "templates/" directory and must live under
          # the version-specific export_templates path Godot looks them up in.
          unzip -q templates.tpz
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          mv templates/* "$template_dir/"

      # Tee Godot output to build.log so the verify step below can fail the run
      # on parse/autoload errors -- a Godot export exits 0 even when scripts
      # fail to compile, so success alone does not mean the project is healthy.
      - name: Import project
        run: ./godot --headless --path . --import 2>&1 | tee -a build.log

      # The scoring engine, exactly. Every relic, boss and target level is pure
      # arithmetic on Run, so it can be asserted rather than sampled.
      - name: Scoring engine unit test
        run: |
          set -euo pipefail
          ./godot --headless --path . tests/run_test.tscn 2>&1 | tee -a build.log
          grep -q "RUN_TEST_OK" build.log

      # Lane routing, asserted deliberately rather than sampled. The bot below
      # cannot be relied on to send a ball down a specific lane, and it took a
      # human playing to notice that the inlane fed the drain -- so the one
      # bug that made the game unplayable gets its own test.
      - name: Inlane / outlane routing test
        run: |
          set -euo pipefail
          # 8000 frames, not 3000: the suite is eight cases now and the budget
          # was set when it was four. Cut short it prints every case that did
          # run as "ok" and simply never reaches INLANE_TEST_OK, which reads
          # like a hang rather than like a timeout.
          ./godot --headless --path . --quit-after 8000 tests/inlane_test.tscn 2>&1 | tee -a build.log
          grep -q "INLANE_TEST_OK" build.log

      # What the flippers do to a ball, asserted against measurements. The coil
      # layer was designed on two claims about them and one was false -- a held
      # flipper already cradles -- so both are now pinned here.
      - name: Flipper behaviour test
        run: |
          set -euo pipefail
          ./godot --headless --path . --quit-after 8000 tests/flipper_test.tscn 2>&1 | tee -a build.log
          grep -q "FLIPPER_TEST_OK" build.log

      # The shop's buy and sell rows are the only part of the game that can be
      # reached solely with a mouse -- the sim taps space through every other
      # screen -- and they now sit inside a SubViewportContainer, which has to
      # forward clicks rather than simply receive them. A shop that stops taking
      # clicks is an unplayable game that passes every other gate here.
      - name: Shop click-through test
        run: |
          set -euo pipefail
          ./godot --headless --path . tests/click_test.tscn 2>&1 | tee -a build.log
          grep -q "CLICK_TEST_OK" build.log

      # Fires a ball at every wall from every angle at the speed clamp, with the
      # flippers hammering. A ball that leaves the cabinet never drains, so the
      # stage never ends and the run cannot even be lost -- the worst failure
      # the game has, and one the bot finds only by luck.
      - name: Ball containment test
        run: |
          set -euo pipefail
          ./godot --headless --path . --quit-after 60000 tests/containment_test.tscn 2>&1 | tee -a build.log
          grep -q "CONTAINMENT_OK" build.log

      # A bot playing the real scene: physics, state machine and HUD. Asserts a
      # floor on what it reaches (a ball served, a point scored, the shop
      # opened) so losing coverage fails the build instead of quietly passing.
      #
      # Checked against build.log AFTER the run rather than piped into
      # `grep -q`: grep -q exits on its first match and SIGPIPEs tee, which
      # truncates everything printed afterwards -- including anything the
      # parse-error check below needs to see.
      - name: Headless gameplay smoke test
        run: |
          set -euo pipefail
          ./godot --headless --path . --quit-after 5000 tests/headless_sim.tscn 2>&1 | tee -a build.log
          grep -q "SIM_OK" build.log

      # The manual's tables are generated from the same Catalog the game runs
      # on, so a cost or an effect cannot be stale in the document and correct
      # in the code. This fails the build if someone changed catalog.gd without
      # regenerating -- which is the only way "kept up to date" survives.
      - name: Manual is up to date
        run: |
          set -euo pipefail
          ./godot --headless --path . tools/dump_catalog.tscn 2>/dev/null > /tmp/catalog.json
          python3 tools/build_manual.py /tmp/catalog.json --check

      - name: Export Web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" "build/web/index.html" 2>&1 | tee -a build.log
          test -f "build/web/index.html"
          # The manual ships inside the same Pages artifact, at /manual/. The
          # game owns the root, so it gets a subpath rather than its own site.
          python3 tools/build_manual.py /tmp/catalog.json --html build/web/manual/index.html
          test -f "build/web/manual/index.html"

      - name: Verify no GDScript parse or autoload errors
        run: |
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Failed to create an autoload|does not inherit from" build.log; then
            echo "::error::GDScript parse or autoload errors detected during export (see matches above)."
            exit 1
          fi
          echo "No GDScript parse/autoload errors detected."

      - name: Upload Pages artifact (web build)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Deploy Web to GitHub Pages
    needs: build
    # Only publish to production Pages from main; PRs build and export for
    # validation without deploying.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
